name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # The release and upstream sync workflows test the commit they are about to release or merge.
  workflow_call:
    inputs:
      ref:
        description: Branch, tag or commit to test. Empty tests the commit of the calling workflow's event.
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v6
        with:
          path: artifacts/downloads
          key: openslide-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('eng/openslide.json') }}
      - name: Stage native OpenSlide
        shell: pwsh
        run: ./eng/Get-OpenSlide.ps1
      - name: Test
        run: dotnet test OpenSlideSharp.slnx -c Release

  omezarr-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v6
        with:
          path: artifacts/downloads
          key: openslide-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('eng/openslide.json') }}
      - name: Stage native OpenSlide
        shell: pwsh
        run: ./eng/Get-OpenSlide.ps1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install zarr-python, ome-zarr and fsspec
        run: pip install -r eng/requirements-interop.txt
      - name: Export OME-Zarr stores
        env:
          OPENSLIDESHARP_INTEROP_DIR: ${{ runner.temp }}/omezarr
        run: dotnet test OpenSlideSharp.slnx -c Release
      - name: Read the stores with zarr-python and ome-zarr
        run: python eng/verify-omezarr.py ${{ runner.temp }}/omezarr
      - name: Export OME-Zarr stores with the tool
        run: |
          for ngff in 0.4 0.5; do
            dotnet run --project src/OpenSlideSharp.Tool -c Release -- omezarr test/OpenSlideSharp.Tests/Fixtures/boxes.tiff --chunk 64 --ngff "$ngff" -o "$RUNNER_TEMP/tool/boxes-$ngff.zarr"
          done
      - name: Read the tool's stores
        # Same chunk size as the interop export, so every level must match its expected pixels.
        run: python eng/verify-omezarr.py --stores "$RUNNER_TEMP/tool/boxes-0.4.zarr" "$RUNNER_TEMP/tool/boxes-0.5.zarr" --manifest "$RUNNER_TEMP/omezarr"
      - name: Start the web sample
        run: |
          # Built by the test step, so the wait below is startup only. setsid gives dotnet run and the app their own
          # process group, which the last step stops.
          setsid dotnet run -c Release --no-build --project samples/OpenSlideSharp.Web -- "$GITHUB_WORKSPACE/test/OpenSlideSharp.Tests/Fixtures/boxes.tiff" -p 5055 > "$RUNNER_TEMP/web.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/web.pid"
          for i in $(seq 60); do
            if curl -fs -o /dev/null http://127.0.0.1:5055/zarr/slide.zarr/zarr.json; then
              echo "The web sample answered after $i s"
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/web.pid")" 2>/dev/null; then
              echo "::error::The web sample exited before serving /zarr/slide.zarr/zarr.json"
              cat "$RUNNER_TEMP/web.log"
              exit 1
            fi
            sleep 1
          done
          echo "::error::The web sample did not serve /zarr/slide.zarr/zarr.json within 60 s"
          cat "$RUNNER_TEMP/web.log"
          exit 1
      - name: Read the served store with zarr-python, fsspec and ome-zarr
        # boxes.tiff fits in one 512-pixel chunk, so the served store has one level, read straight from the slide.
        run: python eng/verify-omezarr.py --url http://127.0.0.1:5055/zarr/slide.zarr --manifest "$RUNNER_TEMP/omezarr"
      - name: Stop the web sample
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/web.pid" ]; then
            kill -- "-$(cat "$RUNNER_TEMP/web.pid")" 2>/dev/null || true
            echo "::group::Web sample log"
            cat "$RUNNER_TEMP/web.log"
            echo "::endgroup::"
          fi

  bindings:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v6
        with:
          path: artifacts/downloads
          key: openslide-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('eng/openslide.json') }}
      - name: Generate bindings
        shell: pwsh
        run: ./eng/Generate-Bindings.ps1
      - name: Verify generated bindings are committed
        shell: pwsh
        run: |
          # Compare content (git diff normalizes line endings); git status can flag an unchanged file on a CRLF checkout.
          git --no-pager diff --exit-code --stat src/OpenSlideSharp/Native
          $diffCode = $LASTEXITCODE
          $untracked = git ls-files --others --exclude-standard src/OpenSlideSharp/Native
          if ($diffCode -ne 0 -or $untracked) {
            git --no-pager diff src/OpenSlideSharp/Native | Select-Object -First 80
            $untracked | ForEach-Object { Write-Host "untracked: $_" }
            Write-Host "::error::Generated bindings differ from the committed ones: run eng/Generate-Bindings.ps1 and commit src/OpenSlideSharp/Native"
            exit 1
          }

  package:
    runs-on: windows-latest
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v6
        with:
          path: artifacts/downloads
          key: openslide-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('eng/openslide.json') }}
      - name: Stage native OpenSlide for all platforms
        shell: pwsh
        run: ./eng/Get-OpenSlide.ps1 -Platform all
      - name: Pack and smoke-test packages
        shell: pwsh
        run: ./eng/Test-Packages.ps1 -Version 0.0.0-ci.${{ github.run_number }}
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/smoke-feed/*.nupkg
          if-no-files-found: error
          # A called ci.yml uploads into the caller's run, and the upstream sync calls it twice in one run (for the sync
          # branch, then through release.yml). The two calls run one after the other, so the second replaces the first's
          # packages before its package-unix jobs download them.
          overwrite: true

  package-unix:
    name: package-unix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts/smoke-feed
      - name: Smoke-test the packed packages
        shell: pwsh
        run: ./eng/Test-Packages.ps1 -SkipPack -Version 0.0.0-ci.${{ github.run_number }}

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Self-test the release version script
        shell: pwsh
        run: ./eng/Get-ReleaseVersion.ps1 -SelfTest
      - name: Self-test the upstream update script
        shell: pwsh
        run: ./eng/Find-UpstreamUpdate.ps1 -SelfTest
      - name: Self-test the upstream sync failure report
        shell: pwsh
        run: ./eng/Report-SyncFailure.ps1 -SelfTest

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Lint the workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          # The sha256 of actionlint_1.7.12_linux_amd64.tar.gz in that release's actionlint_1.7.12_checksums.txt.
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          # actionlint also runs shellcheck, which the runner has, on the bash run: scripts.
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
