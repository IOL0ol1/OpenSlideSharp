name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v6
        with:
          path: artifacts/downloads
          key: openslide-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('eng/openslide.json') }}
      - name: Stage native OpenSlide
        shell: pwsh
        run: ./eng/Get-OpenSlide.ps1
      - name: Test
        run: dotnet test OpenSlideSharp.slnx -c Release

  bindings:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v6
        with:
          path: artifacts/downloads
          key: openslide-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('eng/openslide.json') }}
      - name: Generate bindings
        shell: pwsh
        run: ./eng/Generate-Bindings.ps1
      - name: Verify generated bindings are committed
        shell: pwsh
        run: |
          # --porcelain also lists new untracked files, which git diff would miss.
          $changes = git status --porcelain src/OpenSlideSharp/Native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($changes) {
            $changes | ForEach-Object { Write-Host $_ }
            git --no-pager diff src/OpenSlideSharp/Native | Select-Object -First 80
            Write-Host "::error::Generated bindings differ from the committed ones: run eng/Generate-Bindings.ps1 and commit src/OpenSlideSharp/Native"
            exit 1
          }

  package:
    runs-on: windows-latest
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v6
        with:
          path: artifacts/downloads
          key: openslide-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('eng/openslide.json') }}
      - name: Stage native OpenSlide for all platforms
        shell: pwsh
        run: ./eng/Get-OpenSlide.ps1 -Platform all
      - name: Pack and smoke-test packages
        shell: pwsh
        run: ./eng/Test-Packages.ps1 -Version 0.0.0-ci.${{ github.run_number }}
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/smoke-feed/*.nupkg
          if-no-files-found: error

  package-unix:
    name: package-unix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts/smoke-feed
      - name: Smoke-test the packed packages
        shell: pwsh
        run: ./eng/Test-Packages.ps1 -SkipPack -Version 0.0.0-ci.${{ github.run_number }}
