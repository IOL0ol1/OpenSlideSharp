name: Upstream sync

# Once a day, takes the next newer openslide-bin build (eng/Find-UpstreamUpdate.ps1): one build per run, a release
# before a nightly; any further one waits for the next run.
#   detect          lists the newer builds. None: the run ends here.
#   update          commits eng/openslide.json and the regenerated bindings on sync/<tag> and pushes the branch,
#                   replacing one an earlier run left.
#   ci              tests that commit (ci.yml).
#   merge           fast-forwards master to it and deletes the branch. If master moved meanwhile, or cannot be
#                   updated, it opens a pull request from the branch instead, keeps the branch and nothing is released.
#   release         releases the merged commit (release.yml: a dry run while the NUGET_API_KEY secret is not set).
#   report-failure  after a failure: opens one issue per build, or comments on the open one, and deletes the branch
#                   (eng/Report-SyncFailure.ps1). Nothing reaches master before ci passed on the commit.
# Pushes made with the workflow token start no other workflow, which is why this one calls ci.yml and release.yml.
# A dry run (the dry_run input, or a run on a branch other than master) runs detect and update only: update commits
# locally, pushes nothing and shows the diff in the run summary.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (find and commit the update, push nothing)
        type: boolean
        default: false

permissions:
  contents: read

# A fixed group. ci.yml's group, ${{ github.workflow }}-${{ github.ref }}, takes this workflow's name and ref when it is
# called from here; a group equal to it would make the call wait for this run to end.
concurrency: upstream-sync

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      dry-run: ${{ steps.mode.outputs.dry-run }}
      channel: ${{ steps.find.outputs.channel }}
      tag: ${{ steps.find.outputs.tag }}
      bin-version: ${{ steps.find.outputs.bin-version }}
      version: ${{ steps.find.outputs.version }}
      branch: ${{ steps.find.outputs.branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Choose between sync and dry run
        id: mode
        shell: pwsh
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          $reasons = @()
          if ($env:DRY_RUN -eq 'true') { $reasons += 'a dry run was asked for' }
          if ($env:GITHUB_REF -ne 'refs/heads/master') { $reasons += "the run is on $env:GITHUB_REF, not on master" }
          if ($reasons.Count -gt 0) {
            Write-Host "::notice title=Dry run::The update is committed in the runner only; nothing is pushed, merged or released: $($reasons -join '; ')."
            'dry-run=true' | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8
          }
          else {
            'dry-run=false' | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8
          }
      - name: Look for a newer openslide-bin build
        id: find
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Lowest NuGet version first, [] when there is none. Fails when GitHub or nuget.org cannot be read.
          $json = pwsh -NoProfile -File ./eng/Find-UpstreamUpdate.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $candidates = @(($json -join "`n") | ConvertFrom-Json)
          $pinned = (Get-Content -Raw eng/openslide.json | ConvertFrom-Json).binVersion
          if ($candidates.Count -eq 0) {
            Write-Host "No newer openslide-bin build: eng/openslide.json pins $pinned."
            "No newer openslide-bin build: ``eng/openslide.json`` pins ``$pinned``." | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
            exit 0
          }
          $c = $candidates[0]
          # The tag names a branch and an issue: only the forms eng/Find-UpstreamUpdate.ps1 produces are accepted.
          $known = ($c.channel -ceq 'stable' -and $c.tag -cmatch '^v\d+(\.\d+){2,3}$') -or
            ($c.channel -ceq 'nightly' -and $c.tag -cmatch '^v\d+(\.\d+){2,3}\+\d{8}\.nightly$')
          if (-not $known -or $c.binVersion -cne $c.tag.Substring(1) -or $c.version -cnotmatch '^\d+(\.\d+){2,3}(-[0-9A-Za-z.]+)?$') {
            throw "Unexpected candidate: $($c | ConvertTo-Json -Compress)"
          }
          @(
            "channel=$($c.channel)"
            "tag=$($c.tag)"
            "bin-version=$($c.binVersion)"
            "version=$($c.version)"
            "branch=sync/$($c.tag)"
          ) | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8
          Write-Host "Syncing openslide-bin $($c.tag) ($($c.channel)), NuGet version $($c.version); eng/openslide.json pins $pinned."
          @(
            "## Newer openslide-bin builds"
            ''
            "``eng/openslide.json`` pins ``$pinned``. One build is synced per run, in this order:"
            ''
            '| Channel | Tag | NuGet version |'
            '|---|---|---|'
            ($candidates | ForEach-Object { "| $($_.channel) | ``$($_.tag)`` | ``$($_.version)`` |" })
            ''
            "This run syncs ``$($c.tag)``."
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8

  update:
    needs: detect
    if: needs.detect.outputs.tag != ''
    # Windows, like ci.yml's bindings job, which checks the generated bindings.
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      base: ${{ steps.commit.outputs.base }}
    env:
      CHANNEL: ${{ needs.detect.outputs.channel }}
      TAG: ${{ needs.detect.outputs.tag }}
      BIN_VERSION: ${{ needs.detect.outputs.bin-version }}
      BRANCH: ${{ needs.detect.outputs.branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The token is not left in .git/config, where every step, and the tools it downloads and runs (ClangSharp,
          # libclang, openslide-bin), could read it; only the Pin step (GitHub API) and the push step get it, in env.
          # This job's token can write contents, though, and an earlier step can still change what a later one runs
          # (GITHUB_PATH, GITHUB_ENV, git hooks), so this keeps the token out of plain sight, not from a malicious tool.
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Pin the upstream build in eng/openslide.json
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./eng/Update-OpenSlideManifest.ps1 -Channel $env:CHANNEL -Tag $env:TAG
      - name: Stage native OpenSlide
        shell: pwsh
        run: ./eng/Get-OpenSlide.ps1 -Platform current
      - name: Generate bindings
        shell: pwsh
        run: ./eng/Generate-Bindings.ps1
      - name: Commit the update on the sync branch
        id: commit
        shell: pwsh
        env:
          DRY_RUN: ${{ needs.detect.outputs.dry-run }}
        run: |
          function Invoke-Git {
            $out = & git @args
            if ($LASTEXITCODE -ne 0) { throw "git $($args -join ' ') failed with exit code $LASTEXITCODE." }
            $out
          }
          $manifest = Get-Content -Raw eng/openslide.json | ConvertFrom-Json
          if ($manifest.channel -cne $env:CHANNEL -or $manifest.binVersion -cne $env:BIN_VERSION) {
            throw "eng/openslide.json pins $($manifest.channel) $($manifest.binVersion), not $env:CHANNEL $env:BIN_VERSION."
          }
          # Only the manifest and the generated bindings may change. git diff compares content, so a file that only
          # got other line endings on this CRLF checkout does not count.
          $changed = @(Invoke-Git diff --name-only) + @(Invoke-Git ls-files --others --exclude-standard)
          $unexpected = @($changed | Where-Object { $_ -cne 'eng/openslide.json' -and -not $_.StartsWith('src/OpenSlideSharp/Native/', [StringComparison]::Ordinal) })
          if ($unexpected.Count -gt 0) { throw "The update changed more than the manifest and the bindings: $($unexpected -join ', ')" }
          if ('eng/openslide.json' -cnotin $changed) { throw 'eng/openslide.json did not change.' }
          $base = Invoke-Git rev-parse HEAD
          Invoke-Git switch --quiet --create $env:BRANCH
          Invoke-Git add -- eng/openslide.json src/OpenSlideSharp/Native
          Invoke-Git -c user.name=IOL0ol1 -c user.email=1353839731@qq.com commit --quiet -m "build: track openslide-bin $env:BIN_VERSION"
          $sha = Invoke-Git rev-parse HEAD
          "base=$base", "sha=$sha" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8
          $bindings = @(Invoke-Git --no-pager diff --stat HEAD~1 HEAD -- src/OpenSlideSharp/Native)
          @(
            "## openslide-bin $env:BIN_VERSION"
            ''
            "Committed ``$sha`` (build: track openslide-bin $env:BIN_VERSION) on ``$env:BRANCH``, on top of ``$base``$($env:DRY_RUN -eq 'true' ? '. Dry run: not pushed.' : '.')"
            ''
            '### eng/openslide.json'
            ''
            '```diff'
            (Invoke-Git --no-pager diff HEAD~1 HEAD -- eng/openslide.json)
            '```'
            ''
            '### Generated bindings'
            ''
            ($bindings.Count -gt 0 ? @('```text', $bindings, '```') : 'Unchanged.')
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          Write-Host "Committed $sha on $env:BRANCH."
      - name: Push the sync branch
        if: needs.detect.outputs.dry-run == 'false'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GITHUB_TOKEN"))
          Write-Host "::add-mask::$auth"
          # --force replaces a sync/<tag> that an earlier run left.
          git -c "http.$env:GITHUB_SERVER_URL/.extraheader=AUTHORIZATION: basic $auth" push --force origin "HEAD:refs/heads/$env:BRANCH"
          if ($LASTEXITCODE -ne 0) { throw "Pushing $env:BRANCH failed with exit code $LASTEXITCODE." }

  ci:
    needs: [detect, update]
    if: needs.detect.outputs.dry-run == 'false'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      # The commit update pushed to sync/<tag>: merge fast-forwards master to exactly this commit.
      ref: ${{ needs.update.outputs.sha }}

  merge:
    needs: [detect, update, ci]
    if: needs.detect.outputs.dry-run == 'false'
    # The pull request fallback needs the repository setting "Allow GitHub Actions to create and approve pull
    # requests" (Settings > Actions > General). Without it, opening the pull request fails (HTTP 403), so this job
    # fails and report-failure opens an issue and deletes the branch. A pull request opened with the workflow token
    # starts no workflow: CI does not run on it (a required status check would wait forever) until someone closes and
    # reopens it or pushes to its branch, as its description says.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
      sha: ${{ steps.merge.outputs.sha }}
      pr-url: ${{ steps.merge.outputs.pr-url }}
    steps:
      - name: Fast-forward master to the sync commit, or open a pull request
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.update.outputs.sha }}
          BASE: ${{ needs.update.outputs.base }}
          BRANCH: ${{ needs.detect.outputs.branch }}
          TAG: ${{ needs.detect.outputs.tag }}
          BIN_VERSION: ${{ needs.detect.outputs.bin-version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          repo="repos/$GITHUB_REPOSITORY"
          master=$(gh api "$repo/git/ref/heads/master" --jq .object.sha)
          # Only while master is still the commit the sync started from. With force=false the API also refuses any
          # update that is not a fast-forward, so a master that moved after this check stays as it is.
          if [ "$master" = "$BASE" ] && gh api --method PATCH "$repo/git/refs/heads/master" -f sha="$SHA" -F force=false --silent; then
            {
              echo "merged=true"
              echo "sha=$SHA"
            } >> "$GITHUB_OUTPUT"
            echo "master is now $SHA (openslide-bin $BIN_VERSION)."
            # master has the commit: a failure to delete the branch must not hold back the release.
            if gh api --method DELETE "$repo/git/refs/heads/${BRANCH//+/%2B}" --silent; then
              deleted="\`$BRANCH\` is deleted."
            else
              echo "::warning title=Sync branch kept::Deleting $BRANCH failed; delete it by hand."
              deleted="Deleting \`$BRANCH\` failed; delete it by hand."
            fi
            {
              echo "## Merged openslide-bin $BIN_VERSION"
              echo
              echo "master was fast-forwarded to \`$SHA\`. $deleted"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$master" != "$BASE" ]; then
            reason="master moved from $BASE to $master while the sync ran"
          else
            reason="master could not be fast-forwarded (see the log of $RUN_URL)"
          fi
          # A pull request from the branch, unless one is open already (from an earlier run of the same build).
          url=$(gh api --method GET "$repo/pulls" -f state=open -f base=master -f head="$GITHUB_REPOSITORY_OWNER:$BRANCH" --jq '.[0].html_url // empty')
          if [ -z "$url" ]; then
            body=$(printf '%s\n' \
              "openslide-bin \`$TAG\` passed CI on $SHA in $RUN_URL, but $reason, so it was not merged and nothing was released." \
              "" \
              "A workflow opened this pull request, so no CI runs on it by itself: close and reopen it (or push to its branch) to run CI here." \
              "" \
              "Merging this pull request starts the Release workflow, which tests the merged commit again before it publishes.")
            url=$(gh api --method POST "$repo/pulls" -f base=master -f head="$BRANCH" -f title="build: track openslide-bin $BIN_VERSION" -f body="$body" --jq .html_url)
          fi
          {
            echo "merged=false"
            echo "pr-url=$url"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=Pull request instead of a fast-forward::$reason. openslide-bin $BIN_VERSION waits in $url; nothing is released."
          {
            echo "## openslide-bin $BIN_VERSION waits in a pull request"
            echo
            echo "Not merged: $reason. The update waits in $url, and nothing was released."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: merge
    if: needs.merge.outputs.merged == 'true'
    uses: ./.github/workflows/release.yml
    # release.yml's publish job asks for contents: write (tag and release). GitHub checks a called workflow's
    # permissions when the run starts, whether that job runs or not, so this is needed for its dry runs too.
    # release.yml runs in the concurrency group publish-<ref>, here publish-refs/heads/master, shared with the releases
    # of pushes to master; only one run waits in it: if another release of master is queued while this call waits,
    # GitHub cancels this call. It then ends "cancelled", which is no failure, so report-failure does not run. master
    # has the commit, so a later release includes it; run the Release workflow on master to release it at once.
    permissions:
      contents: write
    with:
      ref: ${{ needs.merge.outputs.sha }}
    secrets: inherit

  report-failure:
    needs: [detect, update, ci, merge, release]
    # The same choice as detect's dry-run output, made without it so that a failed detect is reported too. A
    # cancelled run is no failure and reports nothing; a sync/<tag> branch it leaves is replaced by the next run.
    if: failure() && !inputs.dry_run && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # contents: delete the sync branch.
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Open or update the issue of this build, and delete the sync branch
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect.outputs.tag }}
          NEEDS: ${{ toJSON(needs) }}
          # The branch this run pushed, unless the merge job opened a pull request from it.
          BRANCH: ${{ needs.update.result == 'success' && !needs.merge.outputs.pr-url && needs.detect.outputs.branch || '' }}
        run: >-
          ./eng/Report-SyncFailure.ps1 -Repository $env:GITHUB_REPOSITORY
          -RunUrl "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          -Tag $env:TAG -Jobs $env:NEEDS -Branch $env:BRANCH
